<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BGCSE Quiz — Turn Mode</title>
  <link rel="stylesheet" href="/quiz/style.css">
</head>
<body>
<main class="app">
  <div id="roomBadge" class="roomBadge hidden">
    Room <strong id="roomCodeText"></strong>
    <button id="copyLinkBtn" type="button">Copy spectator link</button>
  </div>

  <button id="hamburgerBtn" class="hamburgerBtn hidden" type="button" aria-label="Menu">☰</button>
  <div id="hamburgerPanel" class="hamburgerPanel hidden">
    <div class="panelInner">
      <h3>Game Menu</h3>
      <div class="panelSection">
        <label>Time per question (next round)</label>
        <div class="panelRow">
          <input id="menuTimeLimit" type="number" min="5" max="600">
          <button id="applyTimeBtn" class="secondaryBtn" type="button">Apply</button>
        </div>
      </div>
      <div class="panelSection">
        <label>Add participant</label>
        <div class="panelRow">
          <input id="menuNewName" placeholder="Name" maxlength="30">
          <button id="addParticipantBtn" class="secondaryBtn" type="button">Add</button>
        </div>
      </div>
      <button id="endGameBtn" class="dangerBtn" type="button">End Game</button>
      <button id="closeMenuBtn" class="secondaryBtn" type="button" style="width:100%;margin-top:10px">Close</button>
    </div>
  </div>
  <section id="landing" class="screen">
    <div class="hero">
      <div class="eyebrow">BGCSE PRACTICE</div>
      <h1>Quiz Battle</h1>
      <p>Take turns. Answer questions. Build your score.</p>
    </div>
    <div class="card">
      <button id="landingStartBtn" class="primary">Start New Quiz</button>
      <button id="landingSpectateBtn" class="primary secondary" style="margin-top:12px">Spectate a Game</button>
      <div id="spectateEntry" class="hidden" style="margin-top:18px">
        <label>Room code</label>
        <input id="spectateCodeInput" maxlength="4" placeholder="ABCD" style="text-transform:uppercase">
        <button id="spectateJoinBtn" class="primary" style="margin-top:12px">Join</button>
      </div>
    </div>
  </section>

  <section id="setup" class="screen hidden">
    <div class="hero">
      <div class="eyebrow">BGCSE PRACTICE</div>
      <h1>Quiz Battle</h1>
      <p>Take turns. Answer questions. Build your score.</p>
    </div>
    <div class="card">
      <h2>Game Setup</h2>
      <label>Number of participants</label>
      <input id="participantCount" type="number" min="1" max="20" value="2">
      <div id="names"></div>

      <label class="settingsLabel">Time per question (seconds)</label>
      <input id="timeLimit" type="number" min="5" max="600" value="45">

      <button id="startBtn" class="primary">Start Game</button>
    </div>
  </section>

  <section id="turnChange" class="screen hidden">
    <div class="hero center">
      <p class="eyebrow" id="turnPhaseLabel">NEXT PERSON IN</p>
      <h1 id="turnRevealName" class="turnName hidden"></h1>
      <div class="bigCountdown" id="turnCountdown">3</div>
    </div>
  </section>

  <section id="game" class="screen hidden">
    <header class="topbar">
      <div>
        <div class="eyebrow">QUIZ BATTLE</div>
        <h1 id="playerName"></h1>
      </div>
      <div class="scoreMini">
        <div>Turn <span id="turnNumber">1</span></div>
        <strong id="timer">45</strong>
        <small>seconds</small>
      </div>
    </header>

    <div class="scoresBar" id="scoresBar"></div>

    <article class="card">
      <div class="questionNumber" id="questionNumber"></div>
      <h2 id="questionText"></h2>
      <div id="questionImageWrap" class="imageWrap hidden">
        <img id="questionImage" alt="Question diagram">
      </div>
      <div id="options" class="options"></div>
      <div id="feedback" class="feedback"></div>
      <button id="nextBtn" class="primary" disabled>Choose an answer</button>
    </article>
  </section>

  <section id="results" class="screen hidden">
    <div class="card final">
      <div class="eyebrow">GAME OVER</div>
      <h1>Final Scores</h1>
      <div id="finalScores"></div>
      <button id="playAgain" class="primary">Play Again</button>
    </div>
  </section>
</main>
<script src="/quiz/questions.js"></script>
<script src="/quiz/app.js"></script>
</body>
</html>
